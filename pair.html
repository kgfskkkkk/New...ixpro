<script src="/site.js"></script>
<script>
  const pair = document.getElementById('pair');
  const submit = document.getElementById('submit');
  const num = document.getElementById('number');
  const agreeCheck = document.getElementById('agreeCheck');

  agreeCheck.addEventListener('change', () => { submit.disabled = !agreeCheck.checked; });

  submit.addEventListener('click', async (e) => {
    e.preventDefault();
    if (!agreeCheck.checked) {
      pair.innerHTML = '<span style="color:#ff9d9d">Please agree to the Terms & Policy first</span>';
      return;
    }
    if (!num.value || num.value.replace(/[^0-9]/g,'').length < 11) {
      pair.innerHTML = '<span style="color:#ff9d9d">Invalid or missing number</span>';
      return;
    }
    const number = num.value.replace(/[^0-9]/g,'');
    num.value = '+' + number;
    pair.innerHTML = '<span style="color:#c9d6cb">Please wait…</span>';
    try {
      let res = await fetch(`/code?number=${number}`);
      let data = await res.json();
      if (data.code) {
        pair.innerHTML = `<div id="copy" style="color:var(--green-soft);cursor:pointer" onclick="copyCode()"><strong>CODE:</strong> <span style="color:#fff">${data.code}</span></div>`;
      } else if (data.status === 'already_pending') {
        pair.innerHTML = `<div id="copy" style="color:var(--green-soft);cursor:pointer" onclick="copyCode()"><strong>Pairing in progress — use this code:</strong> <span style="color:#fff">${data.code}</span></div>`;
      } else if (data.status === 'logged_out') {
        pair.innerHTML = `<div style="color:#ff9d9d">
⚠️ Session was logged out — no auto re-pair.
<button onclick="forceRepair('${number}')" class="repair-btn">Re-Pair</button>
</div>`;
      } else if (data.status === 'already_connected' || data.status === 'already_registered') {
        pair.innerHTML = `<div style="color:#ff9d9d">
⚠️ Number already paired
<button onclick="forceRepair('${number}')" class="repair-btn">Re-Pair</button>
</div>`;
      } else {
        pair.innerHTML = `<span style="color:orangered">Error: ${data.error || 'Unknown error'}</span>`;
      }
    } catch (err) {
      pair.innerHTML = '<span style="color:orangered">Error fetching code</span>';
    }
  });

  function copyCode(){
    const el = document.getElementById('copy');
    if (!el) return;
    const codeEl = el.querySelector('span');
    const txt = (codeEl ? codeEl.innerText : el.innerText).replace(/^.*?:\s*/, '').trim();
    navigator.clipboard?.writeText(txt).then(()=>{
      const old = el.innerHTML;
      el.innerHTML = '<strong style="color:var(--green)">COPIED</strong>';
      setTimeout(()=> el.innerHTML = old,700);
    }).catch(()=>{});
  }

  async function forceRepair(number) {
    pair.innerHTML = '<span style="color:#c9d6cb">Re-pairing… Please wait</span>';
    try {
      let res = await fetch(`/code?number=${number}&force=true`);
      let data = await res.json();
      if (data.code) {
        pair.innerHTML = `<div id="copy" style="color:var(--green-soft);cursor:pointer" onclick="copyCode()"><strong>New CODE:</strong> <span style="color:#fff">${data.code}</span></div>`;
      } else {
        pair.innerHTML = `<span style="color:orangered">Re-pair failed: ${data.error || 'Unknown error'}</span>`;
      }
    } catch (err) {
      pair.innerHTML = '<span style="color:orangered">Error during re-pair</span>';
    }
  }

  document.getElementById('clearBtn').addEventListener('click', ()=> {
    num.value=''; pair.innerHTML=''; num.style.background='';
  });

  num.addEventListener('keydown', (e)=> { if (e.key === 'Enter') submit.click(); });
</script>
